version: '3.8'

services:
  web:
    build: .
    container_name: aulaphp_web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    networks:
      - crud-network

  db:
    image: mysql:8.0
    container_name: aulaphp_db
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: aulaphp
      MYSQL_USER: aluno_user
      MYSQL_PASSWORD: aluno_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - crud-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: aulaphp_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ""
    depends_on:
      - db
    networks:
      - crud-network

networks:
  crud-network:
    driver: bridge

volumes:
  db_data: